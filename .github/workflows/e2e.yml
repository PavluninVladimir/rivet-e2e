name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
      # MinIO для транскриптов сессий (сценарии add-session-visibility):
      # креды и порт как в docker-compose и дефолтах config, bucket создаёт
      # сам rivetd (EnsureBucket).
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: rivet
          MINIO_ROOT_PASSWORD: rivetsecret
        ports: ["9000:9000"]
    steps:
      # Структура как локально: rivet со вложенными rivet-web и rivet-e2e.
      - uses: actions/checkout@v7
        with:
          repository: PavluninVladimir/rivet
          path: rivet
      - uses: actions/checkout@v7
        with:
          repository: PavluninVladimir/rivet-web
          path: rivet/rivet-web
      - uses: actions/checkout@v7
        with:
          path: rivet/rivet-e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet/rivet-service/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: rivet/rivet-web
      - run: npm ci
        working-directory: rivet/rivet-e2e
      - run: npx playwright install --with-deps chromium
        working-directory: rivet/rivet-e2e
      - run: npx playwright test
        working-directory: rivet/rivet-e2e
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            rivet/rivet-e2e/playwright-report
            rivet/rivet-e2e/test-results
