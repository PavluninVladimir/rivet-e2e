name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Токену workflow хватает чтения: прогон ничего не публикует. Без блока
# права зависели бы от настроек репозитория.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rivet
          POSTGRES_PASSWORD: rivet
          POSTGRES_DB: rivet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rivet"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      # S3 для транскриптов сессий (сценарии add-session-visibility).
      # RustFS вместо MinIO: образы MinIO убраны с Docker Hub и Quay.
      # Обычный docker run, а не service-контейнер: тому нельзя передать
      # команду `/data`. Креды и порт как в docker-compose rivet-service,
      # bucket создаёт сам rivetd (EnsureBucket). К старту rivetd (после
      # сборки) S3 давно готов.
      - run: >-
          docker run -d --name s3 -p 9000:9000
          -e RUSTFS_ACCESS_KEY=rivet -e RUSTFS_SECRET_KEY=rivetsecret
          rustfs/rustfs:1.0.3 /data
      # Ветки rivet и rivet-web: одноимённая ветке e2e, если она есть, иначе
      # main. Так изменение, которое идёт сразу в несколько репозиториев
      # (например add-native-agent), проверяется целиком в одном прогоне.
      # Имя ветки идёт только через env и в кавычках: в нём допустимы
      # shell-символы. Поиск по точному refs/heads/<имя>: без префикса
      # ls-remote сравнивает хвост пути и принял бы feature/x за x. Код 2 —
      # ветки нет (берётся main), любой другой ненулевой — сеть или доступ,
      # прогон падает, а не идёт молча против main. Checkout по найденному
      # SHA: прогон и summary ссылаются на один и тот же коммит.
      - name: Ветки rivet и rivet-web
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "### Ветки прогона" >> "$GITHUB_STEP_SUMMARY"
          for repo in rivet rivet-web; do
            url="https://github.com/PavluninVladimir/$repo.git"
            code=0
            out=$(git ls-remote --exit-code --heads "$url" "refs/heads/$BRANCH") || code=$?
            case "$code" in
              0) ref="$BRANCH" ;;
              2)
                ref=main
                code=0
                out=$(git ls-remote --exit-code --heads "$url" refs/heads/main) || code=$?
                if [ "$code" -ne 0 ]; then
                  echo "::error::$repo: git ls-remote main завершился с кодом $code"
                  exit 1
                fi
                ;;
              *)
                echo "::error::$repo: git ls-remote завершился с кодом $code (сеть или доступ, а не отсутствие ветки)"
                exit 1
                ;;
            esac
            sha=$(printf '%s\n' "$out" | head -n 1 | cut -f1)
            if [ -z "$sha" ]; then
              echo "::error::$repo: ls-remote не вернул SHA ветки $ref"
              exit 1
            fi
            echo "$repo -> $ref ($sha)"
            echo "${repo//-/_}=$sha" >> "$GITHUB_OUTPUT"
            echo "- \`$repo\`: \`$ref\` \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          done
      # Структура как локально: rivet со вложенными rivet-web и rivet-e2e.
      # Токен в .git/config не сохраняется: дальше исполняется код из этих
      # репозиториев (install-скрипты npm, стенд), ему токен не нужен.
      - uses: actions/checkout@v7
        with:
          repository: PavluninVladimir/rivet
          ref: ${{ steps.refs.outputs.rivet }}
          path: rivet
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: PavluninVladimir/rivet-web
          ref: ${{ steps.refs.outputs.rivet_web }}
          path: rivet/rivet-web
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: rivet/rivet-e2e
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: rivet/rivet-service/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: rivet/rivet-web
      - run: npm ci
        working-directory: rivet/rivet-e2e
      - run: npx playwright install --with-deps chromium
        working-directory: rivet/rivet-e2e
      - run: npx playwright test
        working-directory: rivet/rivet-e2e
        env:
          RIVET_DATABASE_URL: postgres://rivet:rivet@localhost:5432/rivet?sslmode=disable
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            rivet/rivet-e2e/playwright-report
            rivet/rivet-e2e/test-results

  # Сканер секретов по всей истории.
  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action на pull_request читает список коммитов PR через API:
    # в приватном репозитории без pull-requests: read запрос получит 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Версия, на которой проверены исключения .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1
